{{- if .Values.vault.enabled }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "avatars-service.fullname" . }}-db
spec:
  vaultAuthRef: vault-auth
  mount: secret
  path: avatars/db
  type: kv-v2
  refreshAfter: 1h
  destination:
    name: {{ include "avatars-service.fullname" . }}-secrets
    create: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "avatars-service.fullname" . }}-s3
spec:
  vaultAuthRef: vault-auth
  mount: secret
  path: avatars/s3
  type: kv-v2
  refreshAfter: 1h
  destination:
    name: {{ include "avatars-service.fullname" . }}-secrets
    create: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "avatars-service.fullname" . }}-rabbit
spec:
  vaultAuthRef: vault-auth
  mount: secret
  path: avatars/rabbit
  type: kv-v2
  refreshAfter: 1h
  destination:
    name: {{ include "avatars-service.fullname" . }}-secrets
    create: false
{{- end }}