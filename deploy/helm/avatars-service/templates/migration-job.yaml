apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "avatars-service.fullname" . }}-migrate
  labels:
    {{- include "avatars-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    metadata:
      labels:
        {{- include "avatars-service.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: migrate/migrate:v4.17.0
          command:
            - migrate
            - -path=/migrations
            - -database=$(DATABASE_URI)
            - up
          env:
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "avatars-service.fullname" . }}-secrets
                  key: DATABASE_URI
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: {{ include "avatars-service.fullname" . }}-migrations