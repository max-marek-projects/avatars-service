apiVersion: v1
kind: Service
metadata:
  name: {{ include "avatars-service.fullname" . }}-worker-metrics
  labels:
    {{- include "avatars-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  ports:
    - port: 9091
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "avatars-service.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker