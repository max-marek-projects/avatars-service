replicaCount: 3
image:
  repository: avatars-service
  tag: "dev"
  pullPolicy: IfNotPresent

server:
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

worker:
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

config:
  USER: "nonroot"
  SERVER_ADDRESS: ":8080"
  READ_TIMEOUT: "30s"
  WRITE_TIMEOUT: "30s"
  LOGGER_LEVEL: "INFO"
  MIGRATIONS: "/app/migrations"
  FORCE_MIGRATIONS: "false"

  S3_ENDPOINT: "minio:9000"
  S3_BUCKET: "avatars"
  S3_USE_SSL: "false"
  S3_REGION: ""

  RABBIT_EXCHANGE: "avatars.exchange"
  RABBIT_UPLOAD_KEY: "avatar.uploaded"
  RABBIT_DELETE_KEY: "avatar.deleted"

  MAX_FILE_SIZE: "10485760"
  ALLOWED_MIME_TYPES: "image/jpeg,image/png,image/webp"
  STATIC_DIR: "./web/static"

  OTEL_EXPORTER_OTLP_ENDPOINT: "jaeger:4318"
  OTEL_SERVICE_NAME: "avatars-service"
  OTEL_SAMPLE_RATIO: "1.0"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: avatars.example.com
      paths:
        - path: /
          pathType: Prefix

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

serviceMonitor:
  enabled: true
  interval: 30s

terminationGracePeriodSeconds: 30

vault:
  enabled: true