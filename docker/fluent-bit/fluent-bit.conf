[SERVICE]
    Flush         1
    Grace         5
    Daemon        Off
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

# Docker fluentd driver sends {container_id, container_name, source, log}.
# Tag comes from the per-service `logging.options.tag` in compose.
[INPUT]
    Name        forward
    Listen      0.0.0.0
    Port        24224

# Our app writes JSON to stdout; Docker wraps it in another JSON envelope.
# Parse the inner JSON so that level/msg/trace_id become real fields.
[FILTER]
    Name         parser
    Match        avatars.*
    Key_Name     log
    Parser       avatars-json
    Reserve_Data On

# Only index our structured application logs. Anything that failed inner-JSON
# parsing (raw stdout from non-app containers) has no `level` field and is dropped.
[FILTER]
    Name    grep
    Match   avatars.*
    Regex   level (INFO|DEBUG|WARN|ERROR)

[OUTPUT]
    Name               opensearch
    Match              avatars.*
    Host               opensearch
    Port               9200
    Index              avatars-service
    Suppress_Type_Name On
    tls                Off
    tls.verify         Off
    Retry_Limit        False