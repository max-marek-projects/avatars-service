global:
  scrape_interval: 15s
  # How often Prometheus evaluates alerting rules. Should be <= scrape_interval.
  evaluation_interval: 15s

# Rules that produce alerts. The file is bind-mounted by docker-compose.
rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: avatars-server
    static_configs:
      - targets: ["server:8080"]
  - job_name: avatars-worker
    static_configs:
      - targets: ["worker:9091"]
